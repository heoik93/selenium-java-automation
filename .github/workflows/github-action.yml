name: Selenium Automated Test

on:
  workflow_dispatch: # 오직 깃허브 웹사이트에서 'Run workflow'를 누를 때만 실행
    # push:           <-- 이 부분을 주석 처리하면 push 해도 안 돕니다.
    #   branches: [ "main" ]
    #paths-ignore:
    #  - '**.md'
    #  - '.gitignore'
    #  - 'docs/**'
    #  - 'LICENSE'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Restore Config Properties
        run: |
          mkdir -p src/test/resources
          echo "${{ secrets.CONFIG_PROPERTIES_BASE64 }}" | base64 --decode > src/test/resources/config.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Run Tests with Maven
        run: mvn test -Dmaven.test.failure.ignore=true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: Extent-Report-Run-${{ github.run_number }}
          path: |
            target/ExtentReports/
            **/index.html

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/ExtentReports/
          force_orphan: true # 이전 기록을 덮어쓰기
            
