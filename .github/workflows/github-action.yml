name: Selenium Automated Test

on:
  # 1. 수동 실행을 가능하게 하는 설정 (Actions 탭에서 실행 버튼 생성)
  workflow_dispatch:

  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Restore Config Properties
        run: |
          mkdir -p src/main/resources/config
          echo "${{ secrets.CONFIG_PROPERTIES_BASE64 }}" | base64 --decode > src/main/resources/config/config.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Run Tests with Maven
        run: mvn test

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: Extent-Report
          path: test-output/