name: Selenium Automated Test

on:
  push:
    branches: [ "main", "develop" ]
  repository_dispatch:
    types: [ dev-push-event ]
  workflow_dispatch:
    inputs:
      test_type:
        description: '실행할 테스트 타입을 선택하세요'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full-regression
          - functional
          - ui
          - debug

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine Test Suite
        id: suite_selector
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "suite=testng-smoke.xml" >> $GITHUB_OUTPUT
            echo "mode=Smoke (Dev Repository Push)" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "suite=testng-smoke.xml" >> $GITHUB_OUTPUT
            echo "mode=Smoke (Test Code Push)" >> $GITHUB_OUTPUT
          else
            # 수동 실행 시 입력값에 따라 파일명 결정
            case "${{ github.event.inputs.test_type }}" in
              "smoke") echo "suite=testng-smoke.xml" >> $GITHUB_OUTPUT ;;
              "full-regression") echo "suite=testng-full-regression.xml" >> $GITHUB_OUTPUT ;;
              "functional") echo "suite=testng-functional.xml" >> $GITHUB_OUTPUT ;;
              "ui") echo "suite=testng-ui.xml" >> $GITHUB_OUTPUT ;;
            esac
            echo "mode=${{ github.event.inputs.test_type }} (Manual)" >> $GITHUB_OUTPUT
          fi

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Replace Secrets in Config
        run: |
          sed -i "s|^password=.*|password=${{ secrets.DB_PASSWORD }}|" src/main/resources/config/config.properties
          sed -i "s|^anotheruserpassword=.*|anotheruserpassword=${{ secrets.ANOTHER_USER_PWD }}|" src/main/resources/config/config.properties
          sed -i "s|^adminpassword=.*|adminpassword=${{ secrets.ADMINDB_PWD }}|" src/main/resources/config/config.properties
          sed -i "s|^adminpassword2=.*|adminpassword2=${{ secrets.ADMIN_PWD }}|" src/main/resources/config/config.properties
          sed -i "s|^testpwd=.*|testpwd=${{ secrets.TEST_PWD }}|" src/main/resources/config/config.properties
          sed -i "s|^email.password=.*|email.password=${{ secrets.EMAIL_PWD }}|" src/main/resources/config/config.properties
          sed -i "s|^email.to=.*|email.to=${{ secrets.EMAIL_TO }}|" src/main/resources/config/config.properties

      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Run Tests with Maven
        run: mvn test -DsuiteXmlFile=${{ steps.suite_selector.outputs.suite }} -Dmaven.test.failure.ignore=true
        # [지라 연동을 위한 환경 변수 주입]
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Report-${{ steps.suite_selector.outputs.suite }}-${{ github.run_number }}
          path: |
            target/ExtentReports/
            **/index.html

      - name: Prepare Report for GitHub Pages
        if: always()
        run: |
          mkdir -p ./test-output
          cp ./test-output/Report_*.html ./test-output/index.html || true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-output/
          force_orphan: true