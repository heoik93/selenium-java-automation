name: Selenium Automated Test

on:
  push:
    branches: [ "main" ]  # main 브랜치에 push될 때 실행
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Restore Config Properties
        run: |
          mkdir -p src/test/resources
          echo "${{ secrets.CONFIG_PROPERTIES_BASE64 }}" | base64 --decode > src/test/resources/config.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Run Tests with Maven
        run: mvn test -Dmaven.test.failure.ignore=true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Report-Run-${{ github.run_number }}
          path: |
            target/ExtentReports/
            **/index.html

      - name: Prepare Report for GitHub Pages
        if: always()
        run: |
          # test-output 폴더가 있는지 확인 후 복사 (오류 방지)
          mkdir -p ./test-output
          cp ./test-output/Report_*.html ./test-output/index.html || true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./test-output/
          force_orphan: true