name: Selenium Automated Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore Config Properties
        run: |
          mkdir -p src/test/resources
          echo "${{ secrets.CONFIG_PROPERTIES_BASE64 }}" | base64 --decode > src/test/resources/config.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Run Tests with Maven
        run: mvn test

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: Extent-Report-${{ github.run_number }}
          path: "**/index.html"